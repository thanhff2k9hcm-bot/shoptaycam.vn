<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản Phẩm - Shoptaycam.vn</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;
        --text-main: #f0f6fc;
        --text-muted: #8b949e;
        --primary: #238636;
        --accent: #58a6ff;
        --danger: #da3633;
        --warning: #d29922;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      body.light-mode {
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --border-color: #d8dee4;
        --text-main: #24292f;
        --text-muted: #57606a;
        --primary: #2ea44f;
        --accent: #0969da;
        --danger: #cf222e;
        --warning: #9a6700;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background-color: var(--bg-color) !important;
        color: var(--text-main) !important;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      header {
        background: var(--card-bg) !important;
        padding: 18px 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      .logo {
        color: var(--warning) !important;
        text-decoration: none;
        font-weight: 800;
        font-size: 20px;
      }
      nav {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      nav a {
        color: var(--text-main) !important;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 6px 10px;
        border-radius: 6px;
      }
      nav a:hover {
        color: var(--accent) !important;
        background: rgba(88, 166, 255, 0.1);
      }
      .theme-btn {
        background: var(--card-bg) !important;
        color: var(--text-main) !important;
        border: 1px solid var(--border-color);
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
      }
      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h2 {
        color: var(--accent) !important;
        margin-bottom: 25px;
        font-size: 24px;
        font-weight: 800;
      }

      .filter-box {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        margin-bottom: 25px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
        box-shadow: var(--shadow);
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .filter-group label {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
      }

      .filter-group select,
      .filter-group input {
        padding: 8px 12px;
        background-color: var(--bg-color) !important;
        color: var(--text-main) !important;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        outline: none;
        font-size: 14px;
      }
      .filter-group select option {
        background-color: var(--card-bg) !important;
        color: var(--text-main) !important;
        padding: 8px;
      }
      .filter-group input::placeholder {
        color: var(--text-muted) !important;
        opacity: 0.8;
      }

      .btn-filter {
        background: var(--accent);
        color: white !important;
        border: none;
        padding: 9px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 18px;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px;
      }
      .product-card {
        background: var(--card-bg) !important;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: var(--shadow);
      }
      .product-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 12px;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
      }
      .product-card h4 {
        margin: 0 0 10px 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main) !important;
        height: 44px;
        overflow: hidden;
      }
      .product-card .price {
        color: var(--danger) !important;
        font-weight: 800;
        font-size: 17px;
        margin-bottom: 15px;
      }
      .btn-main {
        background: var(--accent);
        color: white !important;
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        text-align: center;
        font-size: 14px;
        text-decoration: none;
      }

      .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 40px;
      }
      .pagination button {
        padding: 8px 14px;
        background: var(--card-bg);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .pagination button.active {
        background: var(--accent);
        color: white !important;
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Shoptaycam.vn</a>
      <nav>
        <a href="index.html">Trang Chủ</a>
        <a href="products.html">Sản Phẩm</a>
        <a href="cart.html">Giỏ Hàng (<span id="cart-count">4</span>)</a>

        <!-- Đã sửa href thành admincontroller.html để khớp với các trang khác -->
        <a
          href="admincontroller.html"
          id="nav-admin"
          style="color: var(--warning) !important; font-weight: bold; display: none"
          >Quản Trị</a
        >

        <a
          href="profile.html"
          id="user-display"
          style="color: var(--accent) !important; font-weight: bold"
          >admin</a
        >
        <a href="login.html" style="color: var(--danger) !important; font-weight: bold"
          >Đăng Xuất</a
        >
        <button class="theme-btn" onclick="toggleTheme()">Sáng/Tối</button>
      </nav>
    </header>

    <div class="container">
      <h2>Tất Cả Sản Phẩm</h2>

      <div class="filter-box" id="product-filter-container">
        <div class="filter-group">
          <label>Danh mục:</label>
          <select id="filter-category">
            <option value="all">Tất cả danh mục</option>
            <option value="khong-day">Không dây</option>
            <option value="co-day">Có dây</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Nền tảng (Platform):</label>
          <select id="filter-platform">
            <option value="all">Tất cả nền tảng</option>
            <option value="pc">PC</option>
            <option value="console">Console / PS / Switch</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Mức giá:</label>
          <select id="filter-price">
            <option value="all">Tất cả mức giá</option>
            <option value="under-500k">Dưới 500.000 đ</option>
            <option value="500k-1500k">500.000 đ - 1.500.000 đ</option>
            <option value="over-1500k">Trên 1.500.000 đ</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Tìm kiếm nhanh:</label>
          <input type="text" id="filter-keyword" placeholder="Nhập tên tay cầm..." />
        </div>
        <button class="btn-filter" onclick="applyFilters()">Lọc Sản Phẩm</button>
      </div>

      <div class="product-grid" id="product-grid"></div>

      <div class="pagination" id="pagination-container"></div>
    </div>

    <script src="/js/product.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
