<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Thông Tin Sản Phẩm - Shoptaycam.vn</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;
        --text-main: #f0f6fc;
        --text-muted: #8b949e;
        --primary: #238636;
        --accent: #58a6ff;
        --danger: #da3633;
        --warning: #d29922;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      body.light-mode {
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --border-color: #d8dee4;
        --text-main: #24292f;
        --text-muted: #57606a;
        --primary: #2ea44f;
        --accent: #0969da;
        --danger: #cf222e;
        --warning: #9a6700;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }
      /* Tùy chỉnh thanh cuộn trang */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background-color: var(--bg-color) !important;
        color: var(--text-main) !important;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      header {
        background: var(--card-bg) !important;
        padding: 18px 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      .logo {
        color: var(--warning) !important;
        text-decoration: none;
        font-weight: 800;
        font-size: 20px;
      }
      nav {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      nav a {
        color: var(--text-main) !important;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 6px 10px;
        border-radius: 6px;
      }
      nav a:hover {
        color: var(--accent) !important;
        background: rgba(88, 166, 255, 0.1);
      }
      .theme-btn {
        background: var(--card-bg) !important;
        color: var(--text-main) !important;
        border: 1px solid var(--border-color);
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
      }

      .breadcrumb {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .breadcrumb a {
        color: var(--accent);
        text-decoration: none;
      }
      .breadcrumb a:hover {
        text-decoration: underline;
      }

      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h2 {
        color: var(--accent) !important;
        margin-bottom: 25px;
        font-size: 24px;
        font-weight: 800;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px;
      }
      .product-card {
        background: var(--card-bg) !important;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: var(--shadow);
      }
      .product-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 12px;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
      }
      .product-card h4 {
        margin: 0 0 10px 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main) !important;
        height: 44px;
        overflow: hidden;
      }
      .product-card .price {
        color: var(--danger) !important;
        font-weight: 800;
        font-size: 17px;
        margin-bottom: 15px;
      }
      .btn-main {
        background: var(--accent);
        color: white !important;
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        text-align: center;
        font-size: 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Shoptaycam.vn</a>
      <nav>
        <a href="index.html">Trang Chủ</a>
        <a href="products.html">Sản Phẩm</a>
        <a href="cart.html">Giỏ Hàng (<span id="cart-count">0</span>)</a>
        <a
          href="admin.html"
          id="nav-admin"
          style="color: var(--warning) !important; font-weight: bold; display: none"
          >Quản Trị</a
        >
        <a
          href="profile.html"
          id="user-display"
          style="color: var(--accent) !important; font-weight: bold"
          >admin</a
        >
        <a href="login.html" style="color: var(--danger) !important; font-weight: bold"
          >Đăng Xuất</a
        >
        <button class="theme-btn" onclick="toggleTheme()">Sáng/Tối</button>
      </nav>
    </header>

    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">Trang chủ</a> &gt;
        <span id="breadcrumb-title" style="color: var(--text-main)">Danh Sách Sản Phẩm</span>
      </div>

      <h2 id="page-heading">Danh Sách Sản Phẩm</h2>

      <div class="product-grid" id="infomation-product-grid"></div>
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/infomation.js"></script>
  </body>
</html>
