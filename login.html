<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - Shoptaycam.vn</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;
        --text-main: #f0f6fc;
        --text-muted: #8b949e;
        --primary: #238636;
        --primary-hover: #2ea043;
        --accent: #58a6ff;
        --accent-hover: #79c0ff;
        --danger: #da3633;
        --warning: #d29922;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      body.light-mode {
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --border-color: #d8dee4;
        --text-main: #24292f;
        --text-muted: #57606a;
        --primary: #2ea44f;
        --primary-hover: #2c974b;
        --accent: #0969da;
        --accent-hover: #1f883d;
        --danger: #cf222e;
        --warning: #9a6700;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background-color: var(--bg-color) !important;
        color: var(--text-main) !important;
        margin: 0;
        padding: 0;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      header {
        background: var(--card-bg) !important;
        padding: 18px 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .logo a {
        color: var(--warning) !important;
        text-decoration: none;
        font-weight: 800;
        font-size: 20px;
      }

      nav {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }

      nav a {
        color: var(--text-main) !important;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 6px 10px;
        border-radius: 6px;
      }

      nav a:hover {
        color: var(--accent) !important;
        background: rgba(88, 166, 255, 0.1);
      }

      .theme-btn {
        background: var(--card-bg) !important;
        color: var(--text-main) !important;
        border: 1px solid var(--border-color);
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        box-shadow: var(--shadow);
      }

      .form-container {
        max-width: 420px;
        margin: 60px auto;
        background: var(--card-bg) !important;
        padding: 35px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: var(--text-muted) !important;
        font-size: 13px;
      }

      .form-group input {
        width: 100%;
        padding: 12px 16px;
        background: var(--bg-color) !important;
        border: 1px solid var(--border-color);
        color: var(--text-main) !important;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: white !important;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 800;
        font-size: 15px;
        margin-top: 10px;
      }

      .btn-google {
        width: 100%;
        padding: 13px;
        background: #ea4335;
        color: white !important;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo"><a href="index.html">Shoptaycam.vn</a></div>
      <nav>
        <a href="index.html">Trang Chủ</a>
        <a href="products.html">Sản Phẩm</a>
        <a href="cart.html">Giỏ Hàng</a>
        <button class="theme-btn" onclick="toggleTheme()">Sáng/Tối</button>
      </nav>
    </header>

    <div class="form-container">
      <h2
        style="
          text-align: center;
          margin-bottom: 25px;
          color: var(--accent) !important;
          font-weight: 800;
        "
      >
        Đăng Nhập
      </h2>

      <form onsubmit="validateLogin(event)">
        <div class="form-group">
          <label for="login-user">Tên đăng nhập:</label>
          <input type="text" id="login-user" placeholder="Nhập tên đăng nhập" required />
        </div>

        <div class="form-group">
          <label for="login-pass">Mật khẩu:</label>
          <input
            type="password"
            id="login-pass"
            placeholder="Nhập mật khẩu"
            onkeydown="if (event.key === ' ') event.preventDefault();"
            oninput="this.value = this.value.replace(/\s/g, '')"
            required
          />
        </div>

        <button type="submit" class="btn-submit">Đăng Nhập</button>
      </form>

      <button type="button" onclick="loginWithGoogle()" class="btn-google">
        Đăng Nhập Bằng Google
      </button>

      <div
        style="
          text-align: center;
          margin-top: 22px;
          font-size: 14px;
          color: var(--text-muted) !important;
        "
      >
        Chưa có tài khoản?
        <a
          href="register.html"
          style="color: var(--accent) !important; font-weight: bold; text-decoration: none"
          >ĐĂNG KÝ NGAY</a
        >
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
