<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ Hàng - Shoptaycam.vn</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;
        --text-main: #f0f6fc;
        --text-muted: #8b949e;
        --primary: #238636;
        --accent: #58a6ff;
        --danger: #da3633;
        --warning: #d29922;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      body.light-mode {
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --border-color: #d8dee4;
        --text-main: #24292f;
        --text-muted: #57606a;
        --primary: #2ea44f;
        --accent: #0969da;
        --danger: #cf222e;
        --warning: #9a6700;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background-color: var(--bg-color) !important;
        color: var(--text-main) !important;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      header {
        background: var(--card-bg) !important;
        padding: 18px 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      .logo {
        color: var(--warning) !important;
        text-decoration: none;
        font-weight: 800;
        font-size: 20px;
      }
      nav {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      nav a {
        color: var(--text-main) !important;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 6px 10px;
        border-radius: 6px;
      }
      nav a:hover {
        color: var(--accent) !important;
        background: rgba(88, 166, 255, 0.1);
      }
      .theme-btn {
        background: var(--card-bg) !important;
        color: var(--text-main) !important;
        border: 1px solid var(--border-color);
        padding: 7px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h2 {
        color: var(--accent) !important;
        margin-bottom: 20px;
        font-size: 24px;
        font-weight: 800;
      }
      .cart-box {
        background: var(--card-bg);
        padding: 25px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow);
        margin-bottom: 30px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      th,
      td {
        padding: 12px;
        border-bottom: 1px solid var(--border-color);
        text-align: left;
        font-size: 14px;
      }
      th {
        color: var(--text-muted);
        font-weight: 700;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 700;
        color: var(--text-muted);
        font-size: 13px;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 10px 14px;
        background: var(--bg-color) !important;
        border: 1px solid var(--border-color);
        color: var(--text-main) !important; /* Đảm bảo chữ hiển thị sáng rõ */
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }
      .btn-checkout {
        background: var(--primary);
        color: white !important;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 800;
        font-size: 15px;
        width: 100%;
      }
      #qr-section {
        display: none;
        text-align: center;
        margin-top: 20px;
        padding: 15px;
        border: 1px dashed var(--border-color);
        border-radius: 8px;
      }
      #qr-image {
        max-width: 200px;
        margin-top: 10px;
        border-radius: 8px;
      }

      .cart-empty-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 50px 20px;
        gap: 20px;
      }
      .cart-empty-text {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-muted);
        margin: 0;
      }
      .btn-buy-now {
        display: inline-block;
        text-decoration: none;
        width: auto !important;
        padding: 12px 35px;
        font-size: 15px;
        border-radius: 8px;
        text-align: center;
      }
      .cart-table-img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid var(--border-color);
      }
      .qty-btn {
        padding: 2px 8px;
        background: var(--border-color);
        color: var(--text-main);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .qty-value {
        margin: 0 8px;
        font-weight: bold;
      }
      .btn-delete-item {
        background: var(--danger);
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .grand-total-price {
        color: var(--danger);
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Shoptaycam.vn</a>
      <nav>
        <a href="index.html">Trang Chủ</a>
        <a href="products.html">Sản Phẩm</a>
        <a href="cart.html">Giỏ Hàng (<span id="cart-count">4</span>)</a>
        <a
          href="admincontroller.html"
          id="nav-admin"
          style="color: var(--warning) !important; font-weight: bold; display: none"
          >Quản Trị</a
        >
        <a
          href="profile.html"
          id="user-display"
          style="color: var(--accent) !important; font-weight: bold"
          >Tài khoản</a
        >
        <a href="login.html" style="color: var(--danger) !important; font-weight: bold"
          >Đăng Xuất</a
        >
        <button class="theme-btn" onclick="toggleTheme()">Sáng/Tối</button>
      </nav>
    </header>

    <div class="container">
      <h2>Giỏ Hàng Của Bạn</h2>
      <div class="cart-box">
        <div id="cart-content-wrapper">
          <table>
            <thead>
              <tr>
                <th>Hình Ảnh</th>
                <th>Sản Phẩm</th>
                <th>Đơn Giá</th>
                <th>Số Lượng</th>
                <th>Thành Tiền</th>
                <th>Hành Động</th>
              </tr>
            </thead>
            <tbody id="cart-body"></tbody>
          </table>

          <h3 style="margin: 25px 0 15px 0; font-size: 18px; color: var(--text-main)">
            Thông Tin Nhận Hàng
          </h3>
          <div class="form-group">
            <label>Số điện thoại người nhận (10 chữ số):</label>
            <input
              type="text"
              id="checkout-phone"
              placeholder="Nhập số điện thoại"
              maxlength="10"
            />
          </div>
          <div class="form-group">
            <label>Địa chỉ nhận hàng:</label>
            <textarea id="checkout-address" rows="3" placeholder="Nhập địa chỉ chi tiết"></textarea>
          </div>

          <div class="form-group">
            <label>Hình thức thanh toán:</label>
            <label style="font-weight: normal; display: inline-block; margin-right: 15px">
              <input
                type="radio"
                name="payment-method"
                value="cod"
                checked
                onclick="togglePaymentMethod()"
              />
              Thanh toán khi nhận hàng (COD)
            </label>
            <label style="font-weight: normal; display: inline-block">
              <input
                type="radio"
                name="payment-method"
                value="online"
                onclick="togglePaymentMethod()"
              />
              Chuyển khoản QR Online
            </label>
          </div>

          <div id="qr-section">
            <p style="font-weight: bold; margin-bottom: 5px">Quét mã QR để thanh toán đơn hàng:</p>
            <p style="font-size: 13px; color: var(--text-muted)">
              Mã đơn: <span id="qr-order-id"></span> | Tổng tiền:
              <span id="qr-amount" style="color: var(--danger); font-weight: bold"></span>
            </p>
            <img id="qr-image" src="" alt="QR Code" />
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 5px">
              Nội dung chuyển khoản: <span id="qr-content" style="font-weight: bold"></span>
            </p>
          </div>

          <button class="btn-checkout" onclick="checkout()" style="margin-top: 20px">
            Tiến Hành Đặt Hàng
          </button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
